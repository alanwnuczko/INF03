<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styl_1.css">
    <title>Restauracja Wszystkie Smaki</title>
</head>
<body>
    <header>
        <h1>Witamy w restauracji "Wszystkie smaki"</h1>
    </header>

    <section id="left">
        <img src="menu.png" alt="Nasze danie">
    </section>

    <section id="right">
        <h4>U nas dobrze zjesz</h4>
        <ol>
            <li>Obiady od 40 zł</li>
            <li>Przekąski od 10 zł</li>
            <li>Kolacje od 20 zł</li>
        </ol>
    </section>

    <br>

    <section id="bottom">
        <h2>Zarezerwuj stolik on-line</h2>

        <form action="rezerwacja.php" method="POST">
            <label for="data">Data (format rrrr-mm-dd):</label><br>
            <input type="text" name="data" id="data"><br>
            <label for="osoby">Ile osób?:</label><br>
            <input type="number" name="osoby" id="osoby"><br>
            <label for="telefon">Twój numer telfonu</label><br>
            <input type="text" name="telefon" id="telefon"><br>
            <input type="checkbox" name="rodo" id="rodo">
            <label for="rodo">Zgadzam się na przetrwarzanie moich danych osobowych</label><br>
            <button type="reset" id="btn_wyczysc">WYCZYŚĆ</button>
            <button type="submit" id="btn_rezerwuj">REZERWUJ</button>
            
        </form>
    </section>

    <footer>
        <p>Stronę opracował: <em>00000000001</em></p>
    </footer>
</body>
</html>
