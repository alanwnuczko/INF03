<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styl.css">
    <title>Efekty obrazu</title>
</head>
<body>
    <header>
        <h2>Efekty na obrazach</h2>
    </header>
    <main>
        <section id="blokPszczola">
            <img src="pszczola.jpg" alt="pszczola na fioletowym kwiatku" id="imgPszczola"><br>
            <input type="radio" name="efektPszczola" id="pszczolaBlur"><label for="efektPszczola">Blur</label><br>
            <input type="radio" name="efektPszczola" id="pszczolaSepia"><label for="efektPszczola">Sepia</label><br>
            <input type="radio" name="efektPszczola" id="pszczolaNegatyw"><label for="efektPszczola">Negatyw</label><br>
            <button onclick="efektPszczola()">Zastosuj</button>
        </section>
        <section id="blokPomarancza">
            <img src="pomarancza.jpg" alt="drzewo pomarańczy" id="imgPomarancza"><br>
            <button onclick="efektPomaranczaKolor()">Kolorowy</button>
            <button onclick="efektPomaranczaGrayscale()">Czarnobiały</button>
        </section>
        <section id="blokOwoce">
            <img src="owoce.jpg" alt="Kosz pełen owoców" id="imgOwoce"><br>
            <input type="range" class="suwak" id="owoceSuwak" min="0" max="100" value="100"><br>
            <button onclick="efektOwoce()">Zastosuj</button>
        </section>
        <section id="blokZolw">
            <img src="zolw.jpg" alt="Żółw w wodzie" id="imgZolw"><br>
            <input type="range" class="suwak" id="zolwSuwak" min="0" max="250"><br>
            <button onclick="efektZolw()">Zastosuj</button>
        </section>
    </main>
    <footer>
        <p><a href="http://css.com" target="_blank">Zobacz inne efekty obrazu</a></p>
        <p>Stronę wykonał: <a href="https://github.com/alanwnuczko">Alan Wnuczko</a></p>
    </footer>
    <script src="main.js"></script>
</body>
</html>
