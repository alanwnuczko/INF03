<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styl.css">
    <title>Pola figur</title>
</head>
<body>
    <header>
        <h2>Pola figur płaskich</h2>
    </header>
    <main>
        <nav>
            <h3>MENU</h3>
            <ul>
                <li><a href="index.html">Prostokąt i trójkąt</a></li>
                <li><a href="kolo.html">Okrąg i koło</a></li>
            </ul>
        </nav>
        <section>
            <img src="1d.bmp" alt="Figura" id="obrazGlowny"> <br>
            <img src="1m.bmp" alt="Wybierz trójkąt" class="obraz" onclick="zmienObraz('1d.bmp')">
            <img src="2m.bmp" alt="Wybierz Prostokąt" class="obraz" onclick="zmienObraz('2d.bmp')">
        </section>
        <aside>
            <h3>Pole prostokąta / pole trójkąta</h3>
            <label for="bok1">Bok prostokąta / podstawa trójkąta</label> <br>
            <input type="text" id="bok1">  <br>
            <label for="bok2">Drugi bok prostokąta / Wysokość trójkąta</label> <br>
            <input type="text" id="bok2">  <br>
            <button onclick="obliczPole()">Oblicz</button>
            <p id="wynik"></p>
        </aside>
    </main>
    <footer></footer>
</body>
</html>
<script>
    const zmienObraz=(obraz)=> {
        obrazGlowny.src=obraz;
    }
    const obliczPole=()=> {
        //console.log(obrazGlowny.src);
        const dlugoscBok1=parseFloat(bok1.value);
        const dlugoscBok2=parseFloat(bok2.value);
        let pole=0;
        if(obrazGlowny.src.includes("1d.bmp")) {
            //obliczamy pole trójkąta
            pole=(dlugoscBok1*dlugoscBok2)/2;
        }
        else
        {
            pole=dlugoscBok1*dlugoscBok2;
        }
        wynik.innerHTML=pole;
    }
</script>
