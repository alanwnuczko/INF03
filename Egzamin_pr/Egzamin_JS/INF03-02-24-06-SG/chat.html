<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styl.css">
    <title>Chat</title>
</head>
<body>
    <header><h2>Chat</h2></header>
    <aside>
        <h3>Chaty</h3>
        <ul>
            <li>Ogólny</li>
            <li>Tematyczny</li>
            <ol>
                <li>Turystyczny</li>
                <li>Żeglarski</li>
                <li>Filatelistyczny</li>
                <li>Hodowla zwierzątek domowych</li>
            </ol>
        </ul>
        <h3>Uczestnicy</h3>
        <p>Jolanta Nowak</p>
        <img src="Jolka.jpg" alt="Jolanta Nowak">
        <p>Krzysztof Łukasiński</p>
        <img src="Krzysiek.jpg" alt="Krzysztof Łukasiński">
    </aside>
    <main>
        <section id="blokChatu">
            <section id="blokJolanta">
            <img src="Jolka.jpg" alt="Jolanta Nowak">
            <p>Cześć idziesz jutro do kina?</p>
            </section>
            <section id="blokKrzysztof">
                <img src="Krzysiek.jpg" alt="Krzysztof Łukasiński">
                <p>Tak! A ty?</p>
            </section>
        </section>

        <label for="inputWiadomosc">Wpisz wiadomość:</label>
        <input type="text" name="inputWiadomosc" id="inputWiadomosc">
        <button type="submit" onclick="wyslijWiadomosc()">Wyślij</button><br>
        <button type="submit" onclick="generujWiadomosc()">Generuj losową odpowiedź</button>
    </main>
    <footer>
        <h5>Chat wykonał: <a href="https://github.com/alanwnuczko">Alan Wnuczko</a></h5>
    </footer>
    <script src="main.js"></script>
</body>
</html>
