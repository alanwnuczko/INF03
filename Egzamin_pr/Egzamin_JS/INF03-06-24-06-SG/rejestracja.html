<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styl.css">
    <title>Rejestracja</title>
</head>
<body>
    <header>
        <h1>Formularz rejestracyjny konferencji <em>Nasze kwiaty</em></h1>
    </header>

    <main>
        <form>
            <section id="daneOsobowe">
                <h2>Dane osobowe</h2>
                <input type="text" placeholder="Wpisz imię..." name="formularzImie" id="formularzImie" required><br>
                <input type="text" placeholder="Wpisz nazwisko..." name="formularzNazwisko" id="formularzNazwisko" required><br>
                <input type="button" value="Następna karta" class="buttonSubmit" onclick="nastepnaKarta1()">
            </section>
            <section id="daneKontaktowe">
                <h2>Dane kontaktowe</h2>
                <input type="email" placeholder="Twój e-mail..." name="formularzEmail" id="formularzEmail"><br>
                <input type="tel" placeholder="Twój numer telefonu..." name="formularzTelefon" id="formularzTelefon"><br>
                <input type="button" value="Następna karta" class="buttonSubmit" onclick="nastepnaKarta2()">
            </section>
            <section id="hasloLogowania">
                <h2>Hasło do logowania</h2>
                <input type="password" placeholder="Podaj hasło..." name="formularzHaslo" id="formularzHaslo"><br>
                <input type="password" placeholder="Powtorz hasło..." name="formularzPowtorzHaslo" id="formularzPowtorzHaslo"><br>
                <input type="button" value="Zatwierdź" class="buttonSubmit" onclick="zatwierdz()">
            </section>
        </form>
    </main>
    <footer>
        <section id="footer1">
            <video src="motyl.mp4" controls>Przeglądarka nie obsługuje tego formatu</video>
        </section>
        <section id="footer2">
            <h3>Plan konferencji</h3>
            <table>
                <tr><td>9:00 - 12:00</td><td>Pielęgnacja roślin</td></tr>
                <tr><td>13:00 - 15:00</td><td>Targi kwiatowe</td></tr>
            </table>
        </section>
        <section id="footer3">
            <p><a href="https://kwiaty.pl">Internetowa kwiaciarnia</a></p>
        </section>
        <section id="footer4">
            <p>Formularz wykonał: <a href="https://github.com/alanwnuczko">Alan Wnuczko</a></p>
        </section>
    </footer>
    <script src="main.js"></script>
</body>
</html>
