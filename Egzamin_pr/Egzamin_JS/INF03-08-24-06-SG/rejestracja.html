<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styl.css">
    <title>Sklep - rejestracja</title>
</head>
<body>
    <aside>
        <img src="obraz.png" alt="promocje">
        <h2>Sprawdź promocje</h2>
        <table>
            <tr><th>co?</th><th>ile taniej?</th></tr>
            <tr><td>ubrania</td><td>15%</td></tr>
            <tr><td>buty</td><td>25%</td></tr>
        </table>
    </aside>

    <header>
        <h1>Zarejestruj się w sklepie</h1>
    </header>

    <main>
        <button onclick="pokazKlient()">Klient</button>
        <button onclick="pokazAdres()">Adres</button>
        <button onclick="pokazKontakt()">Kontakt</button>
        <section id="sectionKlient">
            <p>Imię</p>
            <input type="text" placeholder="Wpisz dane..." id="inputImie" onblur="aktualizujPostep()">
            <p>Nazwisko</p>
            <input type="text" id="inputNazwisko" onblur="aktualizujPostep()">
            <p>Data urodzenia</p>
            <input type="date" id="inputData" onblur="aktualizujPostep()">
        </section>

        <section id="sectionAdres">
            <p>Ulica</p>
            <input type="text" id="inputUlica" onblur="aktualizujPostep()">
            <p>Numer</p>
            <input type="number" id="inputNumer" onblur="aktualizujPostep()">
            <p>Miasto</p>
            <input type="text" id="inputMiasto" onblur="aktualizujPostep()">
        </section>

        <section id="sectionKontakt">
            <p>Numer komórkowy</p>
            <input type="tel" id="inputTelefon" onblur="aktualizujPostep()"><br>
            <input type="checkbox" name="inputRODO "id="inputRODO" onblur="aktualizujPostep()"><label for="inputRODO">Akceptuję RODO</label><br>
            <button id="buttonZatwierdz" onclick="zatwierdz()">Zatwierdź dane</button>

        </section>
    </main>

    <section id="postep">
        <section id="pasekPostepu"></section>
    </section>
    
    <footer>
        <h4>rejestrację do sklepu wykonał: <a href="https://github.com/alanwnuczko">Alan Wnuczko</a></h4>
    </footer>
    <script src="main.js"></script>
</body>
</html>
