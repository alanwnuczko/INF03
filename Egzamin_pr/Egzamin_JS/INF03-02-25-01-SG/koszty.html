<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Montaż paneli podłogowych</title>
</head>
<body>
    <header>
        <img src="montaz_paneli.png" alt="firma usługowa">
    </header>

    <nav>
        <a href="index.html">Strona Główna</a>
        <a href="oferta.html">Oferta</a>
        <a href="koszty.html">Kalkulator kosztów</a>
    </nav>

    <main>
        <h1>Kalkulator kosztów montażu</h1>
        <label for="szerokosc">Szerokość pomieszczenia [m]:</label>
        <input type="number" name="szerokosc" id="szerokosc">
        <label for="dlugosc">Długość pomieszczenia [m]:</label>
        <input type="number" name="dlugosc" id="dlugosc">

        <p>Typ panelu</p>
        <input type="radio" name="typ" id="laminowane"><label for="laminowane">Panele laminowane</label><br>
        <input type="radio" name="typ" id="winylowe"><label for="winylowe">Panele winylowe</label><br>
        <input type="radio" name="typ" id="podlogowa"><label for="podlogowa">Deska podłogowa</label><br>

        <input type="button" value="Oblicz" onclick="oblicz()">

        <p id="wynik"></p>
    </main>

    <footer>
        <h5>Autor strony: 00000000001</h5>
    </footer>
</body>
<script src="main.js"></script>
</html>
