<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="styl.css">
    <title>Komputery</title>
</head>
<body>
    <section id="kontenerStrony">
        <header>
            <img src="animacja.gif" alt="Pogotowie komputerowe">
        </header>
        <nav>
            <a href="index.html">Strona Główna</a>
            <a href="kontakt.html">Kontakt</a>
        </nav>
        <section id="main1"></section>
        <section id="main2">
            <h2>Kontakt</h2>
            <form>
                <table>
                    <tr>
                        <td>Imię:</td>
                        <td><input type="text" id="inputImie"></td>
                    </tr>
                    <tr>
                        <td>Nazwisko:</td>
                        <td><input type="text" id="inputNazwisko"></td>
                    </tr>
                    <tr>
                        <td>E-mail:</td>
                        <td><input type="email" name="inputEmail" id="inputEmail"></td>
                    </tr>
                    <tr>
                        <td>Zgłoszenie:</td>
                        <td>
                            <select name="selectZgloszenie" id="selectZgloszenie">
                                <option value="naprawa komputerów">naprawa komputerów</option>
                                <option value="odzyskiwanie danych">odzyskiwanie danych</option>
                                <option value="wirusy">wirusy</option>
                                <option value="konfiguracja LAN">konfiguracja LAN</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <input type="checkbox" name="inputKopia" id="inputKopia">
                            <label for="inputKopia">Wyślij kopię wiadomości</label>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <button type="reset">Czyść</button>
                            <button type="button" onclick="wyslij()">Wyślij</button>
                        </td>
                    </tr>
                </table>
                <hr>
                <p id="wynik"></p>
            </form>
        </section>
        <section id="main3"></section>
        <footer>
            <p>Autor: <em><a href="https://github.com/alanwnuczko">Alan Wnuczko</a></em></p>
        </footer>
    </section>
    <script src="main.js"></script>
</body>
</html>
